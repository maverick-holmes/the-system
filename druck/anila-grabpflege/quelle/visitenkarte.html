<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>AniLa Visitenkarte 85x55</title>
<link rel="stylesheet" href="basis.css">
<script src="qr.js"></script><script src="logo.js"></script><script src="assets.js"></script>
<style>
  @page { size: 91mm 61mm; margin: 0; }
  .seite { width: 91mm; height: 61mm; }
  .endf { width: 85mm; height: 55mm; }
  .werte .zeile { position: absolute; display: flex; align-items: center; gap: 2.2mm; font-size: 8.2pt; }
  .werte .ic { width: 4.6mm; height: 4.6mm; }
  .kontakt { position: absolute; left: 42.5mm; top: 4mm; height: 32mm; display: flex; flex-direction: column; justify-content: space-between; }
  .kontakt .zeile { display: flex; align-items: center; gap: 2.2mm; font-size: 7.8pt; line-height: 1.18; }
  .kontakt .ic { width: 5mm; height: 5mm; flex: none; }
</style></head>
<body>

<!-- ================= VORDERSEITE ================= -->
<section class="seite">
  <div class="endf">
    <svg class="abs" style="left:34mm;top:-3mm;width:54mm;height:61mm" viewBox="0 0 54 61">
      <defs><clipPath id="vk"><path d="M10 0 H54 V61 H0 C8 50 4 38 8 26 C11 16 6 8 10 0Z"/></clipPath>
        <linearGradient id="ein" x1="0" x2="1"><stop offset="0" stop-color="#f8f1e7" stop-opacity="1"/><stop offset=".22" stop-color="#f8f1e7" stop-opacity="0"/></linearGradient></defs>
      <image href="bilder/foto-grab-herz.jpg" x="0" y="-4" width="54" height="66" preserveAspectRatio="xMidYMid slice" clip-path="url(#vk)"/>
      <rect x="0" y="0" width="54" height="61" fill="url(#ein)" clip-path="url(#vk)"/>
    </svg>
    <div class="abs" style="left:-5mm;top:-4mm;width:14mm;height:20mm" data-vb="0 0 100 140" data-zweig='{"len":120,"n":9,"seed":71,"blatt":32,"rot":60,"x":6,"y":4}'></div>
    <div class="abs" style="left:-5mm;top:30mm;width:12mm;height:30mm" data-vb="0 0 100 250" data-zweig='{"len":220,"n":11,"seed":74,"blatt":44,"rot":-80,"x":20,"y":248}'></div>
    <div class="abs" style="left:3.5mm;top:3mm;width:35mm;height:25mm" data-logo></div>
    <div class="werte">
      <div class="zeile" style="left:8mm;top:29mm"><div class="ic" data-icon="herz"></div>Zuverlässig</div>
      <div class="zeile" style="left:8mm;top:34.6mm"><div class="ic" data-icon="spross"></div>Individuell</div>
      <div class="zeile" style="left:8mm;top:40.2mm"><div class="ic" data-icon="haende"></div>Regional</div>
      <div class="zeile" style="left:8mm;top:45.8mm"><div class="ic" data-icon="leute"></div>Persönlich</div>
    </div>
    <div class="pinsel" style="left:33mm;top:34.5mm;width:55mm;height:18mm;transform:rotate(-6deg)" data-pinsel='{"w":220,"h":72,"seed":17}'>
      <div class="skript" style="font-size:11pt;line-height:1.02;padding-right:3mm">Liebevolle Grabpflege in<br>Sprockhövel, Hasslinghausen,<br>Gevelsberg und Schwelm<span class="herz-i" data-herz="#f1d3c5"></span></div>
    </div>
  </div>
</section>

<!-- ================= RÜCKSEITE ================= -->
<section class="seite">
  <div class="endf">
    <div class="abs" style="left:-4mm;top:-4mm;width:13mm;height:22mm" data-vb="0 0 100 165" data-zweig='{"len":140,"n":9,"seed":81,"blatt":34,"rot":64,"x":6,"y":4}'></div>
    <div class="abs" style="left:77mm;top:-5mm;width:12mm;height:16mm;opacity:.22" data-vb="0 0 100 160" data-zweig='{"len":140,"n":9,"seed":84,"blatt":36,"rot":115,"x":90,"y":4,"blushAnteil":0}'></div>
    <!-- grüner Schwung unten -->
    <svg class="abs" style="left:-3mm;top:38mm;width:91mm;height:20mm" viewBox="0 0 91 20" preserveAspectRatio="none">
      <path d="M0 10 C24 3 50 2 91 0 V20 H0Z" fill="#48553a"/>
      <path d="M0 8.6 C24 1.8 52 0.4 91 -1.4" fill="none" stroke="#b8684f" stroke-width=".45"/>
      <path d="M0 7.4 C30 0 58 -0.6 91 -2.4" fill="none" stroke="#f1d3c5" stroke-width=".3"/>
    </svg>
    <div class="skript abs" style="left:20mm;top:47.6mm;width:61mm;text-align:right;color:#fff;font-size:13.6pt;white-space:nowrap;transform:rotate(-2.5deg)">Wir pflegen, was Ihnen am Herzen liegt.<span class="herz-i" data-herz="#f1d3c5"></span></div>
    <div class="abs" style="left:3mm;top:8.5mm;width:34mm;height:24.3mm" data-logo></div>
    <svg class="abs" style="left:39.5mm;top:5mm;width:1mm;height:34mm" viewBox="0 0 1 34"><line x1=".5" y1="0" x2=".5" y2="34" stroke="#b8684f" stroke-width=".25"/></svg>
    <div class="kontakt">
      <div class="zeile"><div class="ic" data-icon="person" data-art="voll" data-farbe="#48553a"></div><b style="font-weight:600;font-size:8pt" data-k="name"></b></div>
      <div class="zeile"><div class="ic" data-icon="pin" data-art="voll" data-farbe="#48553a"></div><div>Sprockhövel · Hasslinghausen<br>Gevelsberg · Schwelm</div></div>
      <div class="zeile nur-telefon"><div class="ic" data-icon="telefon" data-art="voll" data-farbe="#48553a"></div><div data-k="telefon"></div></div>
      <div class="zeile"><div class="ic" data-icon="mail" data-art="voll" data-farbe="#48553a"></div><div data-k="mail"></div></div>
      <div class="zeile"><div class="ic" data-icon="web" data-art="voll" data-farbe="#48553a"></div><div data-k="web"></div></div>
    </div>
  </div>
</section>
</body></html>
